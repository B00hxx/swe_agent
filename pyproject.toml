[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "B00hxx", email = "cataloniachangedme@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
